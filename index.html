<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bot Studio</title>
<meta name="theme-color" content="#120c2b">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ff;--glow:rgba(124,92,255,.18);--text:#1b1240;--muted:#5d5683;--card:#fff;--border:#ddd6f5;--accent:#6d4aff;--accent-2:#a78bfa}
@media (prefers-color-scheme:dark){:root{--bg:#120c2b;--glow:rgba(124,92,255,.28);--text:#f3efff;--muted:#b2a9d6;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--accent:#8b6cff;--accent-2:#c4b5fd}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;font-family:"Cairo",system-ui,sans-serif;color:var(--text);background:radial-gradient(60% 40% at 50% 0%,var(--glow),transparent 70%),var(--bg);padding:40px 18px 32px;display:flex;justify-content:center}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
.logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(145deg,var(--accent),#5b34e6);display:grid;place-items:center;box-shadow:0 10px 30px rgba(109,74,255,.4)}
.logo svg{width:50px;height:50px}
h1{font-size:1.7rem;font-weight:700;margin-top:18px}
.bio{color:var(--muted);text-align:center;margin-top:6px;line-height:1.8;max-width:36ch}
.links{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:30px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--text);text-decoration:none}
.link:active{transform:scale(.98)}
.badge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#5b34e6);color:#fff;font-weight:700;font-size:.95rem;font-family:system-ui,sans-serif;direction:ltr}
.name{flex:1;font-weight:600;font-size:1.05rem}
.arrow{flex:none;width:20px;height:20px;color:var(--muted);transform:scaleX(-1)}
footer{margin-top:34px;color:var(--muted);font-size:.9rem;text-align:center}
</style>
</head>
<body>
<main class="wrap">
<div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><line x1="24" y1="5" x2="24" y2="11" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="4.5" r="2.5" fill="#fff"/><rect x="7" y="11" width="34" height="27" rx="9" fill="#fff"/><circle cx="17" cy="23.5" r="4" fill="#5b34e6"/><circle cx="31" cy="23.5" r="4" fill="#5b34e6"/><rect x="17" y="31" width="14" height="3" rx="1.5" fill="#5b34e6"/><rect x="2" y="21" width="4" height="9" rx="2" fill="#fff"/><rect x="42" y="21" width="4" height="9" rx="2" fill="#fff"/></svg></div>
<h1>Bot Studio</h1>
<p class="bio">أتمتة وذكاء اصطناعي وأدوات تسهّل عليك شغلك. تابعني على منصاتي.</p>
<nav class="links">
<a class="link" href="https://x.com/BotStudi_11" target="_blank" rel="noopener"><span class="badge">X</span><span class="name">تويتر (X)</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a class="link" href="https://www.tiktok.com/@bot.studio8" target="_blank" rel="noopener"><span class="badge">TT</span><span class="name">تيك توك</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a class="link" href="https://www.youtube.com/@BotStudio-n9c" target="_blank" rel="noopener"><span class="badge">YT</span><span class="name">يوتيوب</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a class="link" href="https://whatsapp.com/channel/0029Vb9NWTzFMqrU4o14To08" target="_blank" rel="noopener"><span class="badge">WA</span><span class="name">قناة واتساب</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</nav>
<footer>Bot Studio · مستقبل الأتمتة يبدأ من هنا</footer>
</main>
</body>
                                                                                                                                                            </html>
